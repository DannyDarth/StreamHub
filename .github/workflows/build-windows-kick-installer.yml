name: Build Windows StreamHub portable

on:
  workflow_dispatch:
  push:
    branches:
      - feature/kick-clean-rebuild
    paths:
      - .github/workflows/build-windows-kick-installer.yml
      - .github/workflows/install-wine.sh
      - src/app/ui/routes/kick/controller.js
      - src/app/ui/routes/kick/route.js
      - src/app/ui/routes/kick-games/**
      - src/app/ui/routes/kick-game/**
      - src/app/router.js
      - src/app/ui/routes/kick/template.hbs
      - src/app/router.js
      - src/app/ui/routes/settings/**
      - src/app/ui/routes/kick-account/**
      - src/app/ui/routes/kick-followed-channels/**
      - src/app/ui/components/search-bar/**
      - src/app/ui/components/main-menu/**
      - src/app/ui/components/title-bar/**
      - src/config/main.json

concurrency:
  group: kick-windows-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-installer:
    name: Package Windows x64 portable
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install Windows packaging tools
        timeout-minutes: 40
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Rewrite Ubuntu mirrors before the first apt update, including
          # source definitions used by GitHub-hosted runners.
          sudo find /etc/apt -type f -name '*.sources' -exec \
            sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' {} +
          sudo find /etc/apt -type f -name '*.list' -exec \
            sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' {} +
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update
          sudo apt-get install -y nsis
          timeout --signal=TERM --kill-after=30s 35m ./.github/workflows/install-wine.sh

      - name: Install project dependencies
        run: yarn install --pure-lockfile --no-progress --non-interactive

      - name: Compile production app
        run: yarn run grunt clean:tmp_prod webpack:prod

      - name: Package portable Windows 64-bit ZIP
        run: yarn run grunt clean:dist dist:archive_win64

      - name: Extract portable application for single-ZIP download
        run: |
          mkdir -p portable-app
          unzip -q dist/*win64.zip -d portable-app
          test -n "$(find portable-app -type f -print -quit)"

      - name: Upload portable Windows app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: streamhub-windows-x64-portable
          path: portable-app/
          if-no-files-found: error
          retention-days: 14
