name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # the name is the required status check of the master branch
    name: Test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Build the ad blocking plugin (download, verify, patch)
        run: python plugin/build_plugin.py src-tauri/resources/streamlink-plugins
      - name: Test the plugin with Streamlink 8.3
        shell: bash
        env:
          STREAMHUB_TWITCH_PLUGIN: src-tauri/resources/streamlink-plugins/twitch.py
          # keep __pycache__ out of the bundled plugin folder
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python -m pip install --quiet "streamlink==8.3.*" pytest
          python -m pytest -q plugin/tests
          streamlink --plugin-dirs src-tauri/resources/streamlink-plugins --help > help.txt
          for option in --twitch-proxy-playlist --twitch-proxy-playlist-fallback --twitch-backup-stream; do
            grep -q -- "$option" help.txt || { echo "::error::Streamlink is missing $option"; exit 1; }
          done

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build the frontend
        run: npm run build
      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --all-targets

      - name: Build the installer
        run: npx tauri build --ci

      - name: Make the portable build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = 'StreamHub-portable'
          New-Item -ItemType Directory -Force $out | Out-Null
          $exe = Get-ChildItem src-tauri/target/release -Filter *.exe -File | Select-Object -First 1
          if (-not $exe) { throw 'No exe was built' }
          Copy-Item $exe.FullName "$out/StreamHub.exe"
          Copy-Item -Recurse src-tauri/resources/streamlink-plugins "$out/streamlink-plugins"
          @(
            'StreamHub - portable build'
            ''
            'Run StreamHub.exe. Keep the streamlink-plugins folder next to it: it has the Twitch ad blocking plugin.'
            'Needs Streamlink 8.3 or newer (https://streamlink.github.io) and the Microsoft Edge WebView2 runtime (built into Windows 10 and 11).'
            'Settings are stored per user by WebView2, not in this folder.'
          ) | Set-Content "$out/README.txt"
          Get-ChildItem -Recurse $out | Select-Object FullName, Length

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: StreamHub-Windows-x64-portable
          path: StreamHub-portable
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: StreamHub-Windows-x64-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14

  publish:
    # The first build of master with a new version (src-tauri/tauri.conf.json) is published as
    # release "StreamHub Windows v<version>", from this tested build, with release-notes.md.
    name: Publish release (new version only)
    needs: windows
    if: github.repository == 'DannyDarth/StreamHub' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            src-tauri/tauri.conf.json
            release-notes.md
          sparse-checkout-cone-mode: false
      - name: Publish if this version has no release yet
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          TAG="streamhub-windows-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists: nothing to publish"
            exit 0
          fi
          grep -q "v${VERSION}" release-notes.md || { echo "::error::release-notes.md isn't about v${VERSION}"; exit 1; }
          gh run download "$GITHUB_RUN_ID" --name StreamHub-Windows-x64-installer --dir installer
          gh run download "$GITHUB_RUN_ID" --name StreamHub-Windows-x64-portable --dir "StreamHub-${VERSION}-portable"
          mkdir release-assets
          cp "installer/StreamHub_${VERSION}_x64-setup.exe" release-assets/
          test -s "StreamHub-${VERSION}-portable/StreamHub.exe"
          test -s "StreamHub-${VERSION}-portable/streamlink-plugins/twitch.py"
          (cd "StreamHub-${VERSION}-portable" && zip -qr "../release-assets/StreamHub-${VERSION}-Windows-x64-portable.zip" .)
          (cd release-assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release create "$TAG" release-assets/* --target "$GITHUB_SHA" \
            --title "StreamHub Windows v${VERSION}" --notes-file release-notes.md --latest
