name: Publish StreamHub Windows v2.0.0

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/publish-streamhub-windows-v2.0.0.yml

permissions:
  contents: write
  actions: read

env:
  BUILD_RUN: '45103308044'
  BUILD_SHA: 'ca2c28d31678fecb1e641c7a6b45cb7c6c3fa6e8'
  TAG: streamhub-windows-v2.0.0

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the tested Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN}" --jq .conclusion)"
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN}" --jq .head_sha)"
          test "$status" = success
          test "$sha" = "$BUILD_SHA"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite"
            exit 1
          fi

      - name: Download the installer and portable build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name StreamHub-Windows-x64-installer --dir installer
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name StreamHub-Windows-x64-portable --dir StreamHub-2.0.0-portable
          mkdir release-assets
          cp installer/StreamHub_2.0.0_x64-setup.exe release-assets/
          test -s StreamHub-2.0.0-portable/StreamHub.exe
          test -s StreamHub-2.0.0-portable/streamlink-plugins/twitch.py
          (cd StreamHub-2.0.0-portable && zip -qr ../release-assets/StreamHub-2.0.0-Windows-x64-portable.zip .)
          (cd release-assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'NOTES'
          # StreamHub Windows v2.0.0

          StreamHub, rebuilt from the ground up with Tauri: a smaller, faster app (the installer is about 2 MB) with the same rule as before: **ads must not interrupt streams**.

          ## Twitch
          - Sign in, followed live channels, browse top categories and streams, category pages, search and channel pages
          - Ad-free playback through the bundled streamlink-ttvlol plugin; if an ad gets through, StreamHub switches to the next proxy, and a proxy that's down is skipped
          - Never falls back to Twitch with ads on its own (only with "Direct through my VPN" turned on)
          - Optional ad-free backup stream during ad breaks

          ## Kick
          - Sign in on kick.com (Settings → Kick) to see every channel you follow, or add channels yourself
          - Browse top categories and streams, category pages, search and channel pages

          ## Everything else
          - Optional chat panel for Twitch and Kick (Settings → Chat), or chat in your browser or Chatterino
          - Live notifications, tray icon, dark/light theme, smoother playback (more buffering), stream language filter
          - Stop closes the player and its chat

          ## Install
          - **StreamHub_2.0.0_x64-setup.exe**: installer
          - **StreamHub-2.0.0-Windows-x64-portable.zip**: unzip and run StreamHub.exe (keep the streamlink-plugins folder next to it)

          Needs [Streamlink](https://streamlink.github.io/install.html) 8.3 or newer and a video player (VLC by default). The installer isn't code-signed yet: if Windows SmartScreen warns, choose More info → Run anyway.

          StreamHub 2 keeps its own settings, so sign in to Twitch (and Kick) again. Videos and clips aren't in StreamHub 2 yet; StreamHub 1.x (Windows v1.0.2 below) remains available.
          NOTES
          gh release create "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --target "$BUILD_SHA" \
            --title "StreamHub Windows v2.0.0" --notes-file release-notes.md --latest
