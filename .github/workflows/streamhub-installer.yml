name: StreamHub Windows x64 installer

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'build/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/streamhub-installer.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'build/**'
      - 'package.json'
      - 'yarn.lock'
      - '.github/workflows/streamhub-installer.yml'

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Check out StreamHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install Yarn
        run: npm install --global yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate StreamHub icon
        run: |
          python -m pip install Pillow
          python build/resources/generate-streamhub-icon.py

      - name: Build StreamHub for Windows x64
        run: yarn grunt clean:tmp_prod webpack:prod compile:win64

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Bundle Twitch ad-blocking plugin (streamlink-ttvlol + StreamHub patch)
        run: python build/resources/streamlink-plugins/build_plugin.py build/releases/streamlink-twitch-gui/win64/streamlink-plugins

      - name: Install NSIS
        shell: powershell
        run: choco install nsis --yes --no-progress

      - name: Package Windows installer
        shell: powershell
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'build/releases/streamlink-twitch-gui/win64'
          if (!(Test-Path (Join-Path $source 'streamlink-twitch-gui.exe'))) {
            throw "Missing StreamHub executable in $source"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $makensis = "${env:ProgramFiles(x86)}\\NSIS\\makensis.exe"
          if (!(Test-Path $makensis)) { $makensis = 'C:\\Program Files\\NSIS\\makensis.exe' }
          & $makensis "/DAPP_SOURCE=$source" 'build/resources/streamhub-installer.nsi'
          if ($LASTEXITCODE -ne 0) { throw "NSIS installer packaging failed" }
          Move-Item 'build/resources/StreamHub-Windows-x64-Setup.exe' 'dist/StreamHub-Windows-x64-Setup.exe'

      - name: Add portable build readme
        shell: powershell
        run: |
          $readme = @(
            'StreamHub for Windows (x64), portable build',
            '',
            'Extract this folder anywhere and run streamlink-twitch-gui.exe. Nothing is installed.',
            'Streamlink must be installed separately: https://streamlink.github.io/install.html',
            '',
            'Twitch ad blocking uses the plugin in the streamlink-plugins folder next to the exe.',
            'Settings are shared with an installed StreamHub, so switch back and forth freely.',
            '',
            "Built from commit $env:GITHUB_SHA"
          )
          Set-Content -Encoding utf8 -Path 'build/releases/streamlink-twitch-gui/win64/README-PORTABLE.txt' -Value $readme

      - name: Upload portable build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: StreamHub-Windows-x64-portable
          path: build/releases/streamlink-twitch-gui/win64/
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: streamhub-windows-x64-installer
          path: dist/StreamHub-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 14
