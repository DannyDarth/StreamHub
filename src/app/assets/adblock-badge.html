<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>StreamHub ad blocking</title>
<style>
	html, body {
		margin: 0;
		padding: 0;
		background: transparent;
		overflow: hidden;
		user-select: none;
		cursor: default;
		font: 13px/1.3 "Segoe UI", Roboto, sans-serif;
	}
	.badge {
		box-sizing: border-box;
		display: flex;
		align-items: center;
		gap: 10px;
		height: 56px;
		margin: 4px;
		padding: 0 14px 0 12px;
		border-radius: 14px;
		background: rgba(18, 18, 22, .86);
		border: 1px solid rgba(255, 255, 255, .08);
		box-shadow: 0 4px 16px rgba(0, 0, 0, .35);
		color: #f2f2f5;
		opacity: 0;
		transform: translateY(-6px);
		transition: opacity .25s ease, transform .25s ease;
	}
	.badge.visible {
		opacity: 1;
		transform: none;
	}
	.icon {
		flex: none;
		width: 26px;
		height: 26px;
	}
	.icon path.shield { fill: var(--accent); }
	.icon path.mark { fill: none; stroke: #121216; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
	.text { min-width: 0; }
	.label { font-weight: 600; font-size: 14px; }
	.detail {
		color: rgba(242, 242, 245, .7);
		font-size: 12px;
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
	}
	.success { --accent: #3ccf6e; }
	.info { --accent: #4aa3ff; }
	.warning { --accent: #f5b83d; }
	.danger { --accent: #f2555a; }
</style>
</head>
<body>
<div class="badge success" id="badge" title="Click to hide">
	<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
		<path class="shield" d="M12 1.8 3.5 5.2v6.1c0 5.3 3.6 9.9 8.5 11 4.9-1.1 8.5-5.7 8.5-11V5.2z"/>
		<path class="mark" id="mark" d="m8 12.3 2.8 2.8L16.3 9.5"/>
	</svg>
	<div class="text">
		<div class="label" id="label"></div>
		<div class="detail" id="detail"></div>
	</div>
</div>
<script>
	// called by StreamHub's main window (see utils/adblock-badge.js)
	const marks = {
		success: "m8 12.3 2.8 2.8L16.3 9.5",
		info: "m8 12.3 2.8 2.8L16.3 9.5",
		warning: "M12 7.5v5.5M12 16.5v.1",
		danger: "m9 9 6 6M15 9l-6 6"
	};
	window.setStatus = function( status ) {
		const badge = document.getElementById( "badge" );
		badge.className = `badge ${status.level} visible`;
		document.getElementById( "label" ).textContent = status.label || "";
		document.getElementById( "detail" ).textContent = status.detail || "";
		document.getElementById( "mark" ).setAttribute( "d", marks[ status.level ] || marks.success );
	};
	window.fadeOut = function() {
		document.getElementById( "badge" ).classList.remove( "visible" );
	};
	document.addEventListener( "click", () => {
		window.fadeOut();
		if ( typeof window.onBadgeClick === "function" ) {
			window.onBadgeClick();
		}
	});
</script>
</body>
</html>
